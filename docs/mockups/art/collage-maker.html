<!doctype html><html><head><meta charset="utf-8"><title>working</title></head><body style="margin:0;background:#555">
<canvas id="c"></canvas><pre id="out"></pre>
<script>
// Collage maker for Half a Line room backdrops. ?room=renaissance|midcentury|cabin&mode=desk|phone&q=0.7
const P=new URLSearchParams(location.search),room=P.get("room"),mode=P.get("mode")||"desk",Q=+(P.get("q")||.7),show=P.has("show");
const W=mode==="desk"?1600:600,H=mode==="desk"?1000:1300;
let seed=room.length*97+(mode==="desk"?1:7);const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
const R={
 renaissance:{bg:"#D6B78A",bg2:"#C9A673",desk:[
  ["print","r-grotesque",.5,.05,.38,0],["print","r-ducerceau",.5,.975,.34,-1],["print","r-facade",.235,.42,.06,2],
  ["photo","r-popolo",.07,.5,.16,6],["photo","r-studiolo",.13,.22,.25,-4],["print","r-capprint",.17,.63,.17,-3],["photo","r-botticelli",.08,.86,.16,5],
  ["print","r-capdraw",.83,.88,.22,2],["photo","r-marcellus",.87,.2,.25,3],["photo","r-verrocchio",.92,.58,.15,-5],["cut","r-rossellino",.8,.5,.11,6]],
  phone:[["photo","r-studiolo",.3,.07,.75,-4],["print","r-grotesque",.75,.17,.7,3],["photo","r-marcellus",.7,.3,.78,3],["photo","r-botticelli",.22,.42,.5,-5],["print","r-capprint",.8,.5,.55,4],["photo","r-verrocchio",.75,.66,.5,5],["cut","r-rossellino",.25,.68,.42,-6],["print","r-capdraw",.35,.84,.7,-2],["photo","r-popolo",.72,.94,.75,3]]},
 midcentury:{bg:"#EEE6D6",bg2:"#E4D8C3",shapes:true,desk:[
  ["shape","#E07A3A",.05,.12,.12,0,"circle"],["shape","#2E7D78",.92,.93,.16,8,"rect"],["shape","#F2B632",.955,.1,.1,0,"circle"],["shape","#6E7D45",.03,.6,.12,-10,"half"],["shape","#C8553D",.23,.97,.1,-6,"rect"],["shape","#F2B632",.2,.5,.05,0,"circle"],
  ["photo","m-ps1",.1,.47,.2,5],["photo","m-ps3",.14,.24,.25,-3],["photo","m-schreiber2",.12,.78,.18,4],["photo","m-faculty",.79,.5,.14,-6],["photo","m-ps4",.87,.24,.25,3],["photo","m-schreiber1",.88,.68,.21,-3],["photo","m-ps5",.5,.985,.26,-1]],
  phone:[["shape","#E07A3A",.15,.05,.4,0,"circle"],["shape","#2E7D78",.85,.4,.5,10,"rect"],["shape","#F2B632",.9,.8,.35,0,"circle"],["shape","#6E7D45",.1,.62,.4,-8,"half"],
  ["photo","m-ps3",.62,.08,.8,3],["photo","m-schreiber2",.3,.26,.55,-4],["photo","m-ps4",.4,.45,.8,-3],["photo","m-schreiber1",.7,.62,.6,4],["photo","m-faculty",.3,.8,.62,-3],["photo","m-ps5",.7,.95,.8,2]]},
 cabin:{bg:"#B4895B",bg2:"#A47A4E",logs:true,desk:[
  ["print","c-sketch",.5,.06,.42,0,null,[.03,.1,.97,.88]],["cut","c-quilt1",.1,.3,.19,-6],["photo","c-kensett",.13,.76,.22,4],["cut","c-quilt2",.975,.5,.1,8],
  ["photo","c-interior1895",.875,.25,.2,4,null,[0,.09,1,.85]],["photo","c-morris",.85,.72,.2,-4,null,[.02,.07,.98,.97]],["photo","c-hill",.5,.97,.26,-1,null,[.12,.15,.9,.85]],["photo","c-notch",.035,.55,.08,-3]],
  phone:[["cut","c-quilt1",.25,.07,.65,-6],["photo","c-interior1895",.72,.13,.65,4,null,[0,.09,1,.85]],["photo","c-kensett",.35,.32,.75,-3],["cut","c-quilt2",.85,.45,.45,8],["photo","c-morris",.3,.55,.65,3,null,[.02,.07,.98,.97]],["photo","c-fireplace",.72,.72,.65,-4],["photo","c-notch",.2,.8,.38,5],["photo","c-hill",.6,.93,.8,-2,null,[.12,.15,.9,.85]]]}
}[room];
const cv=document.getElementById("c"),x=cv.getContext("2d");cv.width=W;cv.height=H;
function torn(w,h,j){const p=new Path2D(),s=7;const pts=[];
  for(let i=0;i<=w;i+=s)pts.push([i,(rnd()-.5)*j]);for(let i=0;i<=h;i+=s)pts.push([w+(rnd()-.5)*j,i]);
  for(let i=w;i>=0;i-=s)pts.push([i,h+(rnd()-.5)*j]);for(let i=h;i>=0;i-=s)pts.push([(rnd()-.5)*j,i]);
  pts.forEach(([a,b],k)=>k?p.lineTo(a-w/2,b-h/2):p.moveTo(a-w/2,b-h/2));p.closePath();return p}
function grain(a){const d=x.getImageData(0,0,W,H),v=d.data;for(let i=0;i<v.length;i+=4){const n=(rnd()-.5)*a;v[i]+=n;v[i+1]+=n;v[i+2]+=n}x.putImageData(d,0,0)}
function tape(cx,cy,rot){x.save();x.translate(cx,cy);x.rotate(rot);x.fillStyle="rgba(236,222,180,.78)";x.shadowColor="rgba(0,0,0,.15)";x.shadowBlur=3;x.fill(torn(70,22,3));x.restore()}
const load=s=>new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src="img/"+s+".jpg"});
(async()=>{
  // Paper: the room's colour, a soft calm wash in the middle (desktop), grain.
  x.fillStyle=R.bg;x.fillRect(0,0,W,H);
  const g=x.createRadialGradient(W/2,H/2,W*.1,W/2,H/2,W*.75);g.addColorStop(0,"rgba(255,255,255,.18)");g.addColorStop(1,R.bg2);x.fillStyle=g;x.fillRect(0,0,W,H);
  if(R.logs){const lh=mode==="desk"?64:56;for(let y=0;y<H;y+=lh){const lg=x.createLinearGradient(0,y,0,y+lh);lg.addColorStop(0,"rgba(255,235,200,.10)");lg.addColorStop(.45,"rgba(255,235,200,0)");lg.addColorStop(.85,"rgba(60,30,10,.16)");lg.addColorStop(1,"rgba(40,20,5,.28)");x.fillStyle=lg;x.fillRect(0,y,W,lh)}}
  for(const [kind,src,cx,cy,fw,rot,shape,crop] of R[mode]){
    x.save();x.translate(cx*W,cy*H);x.rotate(rot*Math.PI/180);
    if(kind==="shape"){const s=fw*W;x.fillStyle=src;x.shadowColor="rgba(0,0,0,.18)";x.shadowBlur=8;x.shadowOffsetY=3;
      if(shape==="circle"){x.beginPath();x.arc(0,0,s/2,0,7);x.fill()}else if(shape==="half"){x.beginPath();x.arc(0,0,s/2,Math.PI,0);x.fill()}else x.fill(torn(s,s*.6,2));x.restore();continue}
    const im=await load(src);if(!im){x.restore();continue}
    const c=crop||[0,0,1,1],sx=im.width*c[0],sy=im.height*c[1],sw=im.width*(c[2]-c[0]),sh=im.height*(c[3]-c[1]),w=fw*W,h=w*sh/sw;const draw=()=>x.drawImage(im,sx,sy,sw,sh,-w/2,-h/2,w,h);
    if(kind==="photo"){const b=Math.max(8,w*.035);x.shadowColor="rgba(30,20,10,.38)";x.shadowBlur=14;x.shadowOffsetY=5;x.fillStyle="#F7F2E6";x.fill(torn(w+2*b,h+2*b,2.5));x.shadowColor="transparent";draw();
      x.restore();if(rnd()>.35)tape(cx*W+(rnd()-.5)*w*.5,cy*H-h/2-b,(rnd()-.5)*.6);continue}
    const path=torn(w,h,kind==="cut"?7:4);
    if(kind==="print"){x.globalCompositeOperation="multiply";x.globalAlpha=.85;x.clip(path);draw()}
    else{x.shadowColor="rgba(30,20,10,.4)";x.shadowBlur=12;x.shadowOffsetY=4;x.fillStyle="#000";x.fill(path);x.shadowColor="transparent";x.clip(path);draw()}
    x.restore();
  }
  grain(14);
  document.getElementById("out").textContent=cv.toDataURL("image/webp",Q);document.title="done";
})();
</script></body></html>
