<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Word-reveal prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Prototype of the clean-slate game in direction A's look. Not the real site: progress is not saved.
   Every word starts as a blank at its real length; small linking words show from the start
   (except in the giveaway piece); each clue inks in the next piece, in the reveal order already in lines.js. */
:root{
  --paper:#F5F0E6; --ink:#1E1B17; --muted:#6B6358; --rule:#D9D0BF; --red:#8A2E1C; --wash:#EADFC6; --fresh:#F3E2B3;
  --serif:"EB Garamond", Garamond, Georgia, serif; --sans:"Instrument Sans", system-ui, sans-serif; --r:3px;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#16140F; --ink:#EDE6D8; --muted:#A39A8A; --rule:#38322A; --red:#E08A72; --wash:#2E281E; --fresh:#4A3F22}}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
.page{max-width:620px;margin:0 auto;padding:0 20px 40px}
header{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:14px 0 12px;border-bottom:1px solid var(--ink)}
header span:first-child,header span:last-child{color:var(--muted);font-size:14px;font-weight:500}
header span:last-child{justify-self:end}
.mark{font-family:var(--serif);font-size:25px;color:var(--ink)}
.mark b{font-weight:600;border-bottom:1.5px solid var(--red);padding-bottom:1px}
.dateline{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);padding:9px 0;border-bottom:1px solid var(--rule)}
.budget{display:flex;align-items:center;gap:14px;margin:26px 0 0}
.ticks{display:flex;gap:5px}
.ticks span{width:22px;height:3px;background:var(--rule);border-radius:var(--r);transition:background-color .4s ease}
.ticks .used{background:var(--red)}
.budget p{margin:0;font-size:13px;color:var(--muted)}
.epigraph{margin:30px 0 0;font-family:var(--serif);font-size:clamp(27px,6.6vw,38px);line-height:1.5;font-weight:400;text-wrap:pretty}
/* A hidden word: its real width, a pale tint, a hairline under it */
.w{transition:color .6s ease,background-color .6s ease,border-color .6s ease;transition-delay:var(--d,0ms);border-bottom:1.5px solid transparent;border-radius:1px}
.w.hid{color:transparent;background:var(--wash);border-bottom-color:var(--ink);user-select:none}
.w.fresh{background:var(--fresh)}
.end .w{background:transparent}
.how{margin:22px 0 0;font-size:15px;color:var(--muted)}
.ask{margin:26px 0 0}
.ask label{display:block;font-family:var(--serif);font-style:italic;font-size:20px;margin-bottom:6px}
.field{display:flex;gap:10px;align-items:stretch;position:relative}
.combo{flex:1;min-width:0;position:relative}
input{width:100%;font:400 17px var(--sans);color:var(--ink);background:transparent;border:0;border-bottom:1.5px solid var(--ink);border-radius:0;padding:10px 2px}
input:focus{outline:none;border-bottom-color:var(--red)}
input::placeholder{color:var(--muted)}
.sugg{list-style:none;margin:0;padding:4px 0;position:absolute;left:0;right:0;top:100%;background:var(--paper);border:1px solid var(--ink);border-radius:var(--r);z-index:5;max-height:250px;overflow:auto}
.sugg li{padding:8px 12px;cursor:pointer;display:flex;justify-content:space-between;gap:12px;font-size:15px}
.sugg li small{color:var(--muted);text-align:right}
.sugg li[aria-selected=true],.sugg li:hover{background:var(--wash)}
.btn{font:600 15px var(--sans);border-radius:var(--r);padding:11px 20px;border:1.5px solid var(--ink);background:var(--ink);color:var(--paper);cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--rule);text-align:left}
.btn.ghost:hover{border-color:var(--ink)}
button:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.work:focus{outline:none}
.quiet{font:500 15px var(--sans);background:none;border:0;color:var(--ink);text-decoration:underline;text-decoration-color:var(--rule);text-underline-offset:4px;padding:0;cursor:pointer}
.below{display:flex;justify-content:space-between;align-items:baseline;margin-top:14px;font-size:14px;color:var(--muted)}
.msg{color:var(--red);font-size:14px;margin:10px 0 0;min-height:21px}
.six{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.six .btn{font-weight:500;font-size:14.5px;padding:10px 12px}
.six .btn s{color:var(--muted)}
footer{margin-top:44px;padding-top:12px;border-top:1px solid var(--rule);font-size:13px;color:var(--muted)}
.days{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.days button{font:500 13px var(--sans);background:none;border:1px solid var(--rule);border-radius:var(--r);color:var(--ink);padding:4px 9px;cursor:pointer}
.days button[aria-current=true]{border-color:var(--ink)}
/* End */
.verdict{margin:28px 0 0;font-size:14px;color:var(--muted);text-align:center}
.verdict i{display:block;font-family:var(--serif);font-size:26px;color:var(--red);margin-bottom:2px}
.end .epigraph{text-align:center;margin-top:18px;font-size:clamp(24px,5.6vw,32px);line-height:1.42}
.orn{width:56px;height:1px;background:var(--ink);margin:26px auto}
.work{font-family:var(--serif);font-style:italic;font-weight:400;font-size:clamp(40px,11vw,64px);line-height:1.05;text-align:center;margin:0;text-wrap:balance}
.byline{text-align:center;font-family:var(--serif);font-size:19px;margin:12px 0 0}
.byline span{display:block;font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:4px}
.note{font-family:var(--serif);font-size:19px;line-height:1.55;margin:30px 0 0;text-wrap:pretty}
.slip{margin:32px 0 0;border:1px solid var(--ink);border-radius:var(--r);padding:18px 20px;display:grid;gap:14px}
.slip pre{margin:0;font:400 16px/1.5 var(--sans);white-space:pre-wrap}
.slip .row{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ladder{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-wrap:wrap;justify-content:center;gap:2px 16px;font-family:var(--serif);font-size:16px;color:var(--muted)}
.ladder .me{color:var(--red);font-style:italic}
@media (min-width:900px){.page{max-width:680px}header{padding-top:22px}.epigraph{font-size:42px;margin-top:40px}.end .epigraph{font-size:34px}}
@media (prefers-reduced-motion:reduce){.w,.ticks span{transition:none}}
</style>
</head>
<body>
<div class="page">
  <header><span>Archive</span><span class="mark"><i>Half a</i> <b>Line</b></span><span>Stats</span></header>
  <div class="dateline"><span id="no"></span><span id="date"></span></div>
  <main id="game"></main>
  <p class="sr" id="status" role="status" aria-live="polite" style="position:absolute;left:-9999px"></p>
  <footer>Prototype, not the real site: nothing is saved. Try another line:
    <div class="days" id="days"></div>
  </footer>
</div>
<script src="../../site/lines.js"></script>
<script>
const LINES=window.HAL_LINES.slice(0,10), WORKS=window.HAL_WORKS||[];
const EPOCH=new Date(2026,10,18);
const RANKS=["By heart","Well read","Bookish","Dog-eared","Skimmed","Last page"], MISS="Still reading";
// Small linking words show from the start, except inside the giveaway piece.
const GLUE=new Set("a an the and or but nor of to in on at by for with from into upon as so than then there that this these those which who whom whose what when where while if is am are was were be been it its it’s ’tis i me my mine we us our you your thou thee thy he him his she her they them their no not do does did have has had would shall should may might must can could".split(" "));
const $=id=>document.getElementById(id);
const norm=s=>s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g,"").replace(/&/g,"and").replace(/[^a-z0-9 ]/g," ").replace(/\s+/g," ").trim();
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
let n=1,L,st;

function start(day){
  n=day;L=LINES[n-1];
  const pieces=L.parts.map(([t,o])=>({t,o})), max=Math.max(...pieces.map(p=>p.o));
  st={clues:0,max,done:false,won:false,misses:[],easy:false,six:false,last:0};
  $("no").textContent="No. "+n;
  $("date").textContent=new Date(EPOCH.getFullYear(),EPOCH.getMonth(),EPOCH.getDate()+n-1).toLocaleDateString("en-GB",{weekday:"long",day:"numeric",month:"long"}).replace(/^(\w+) /,"$1, ");
  $("days").innerHTML=LINES.map((_,k)=>'<button aria-current="'+(k+1===n)+'">'+(k+1)+'</button>').join("");
  [...$("days").children].forEach((b,k)=>b.onclick=()=>{start(k+1);history.replaceState(null,"","#d"+(k+1))});
  render();
}
// Build the line: each word is a span that knows its piece's reveal order and whether it is a linking word.
function lineHTML(final){
  let h="",k=0;
  for(const [text,o] of L.parts){
    const tokens=text.split(/([A-Za-zÀ-ÿ’'\-]+)/);
    h+=(h?" ":"");
    for(let i=0;i<tokens.length;i++){const t=tokens[i];if(!t)continue;
      if(i%2===0){h+=esc(t);continue}
      const glue=GLUE.has(t.toLowerCase())&&o!==st.max;
      const shown=final||glue||o<=st.clues;
      const fresh=!final&&!glue&&o===st.clues&&st.last===st.clues;
      h+='<span class="w'+(shown?'':' hid')+(fresh?' fresh':'')+'" style="--d:'+(fresh?(k++*70):0)+'ms">'+esc(shown?t:t)+'</span>';
    }
  }
  return h;
}
function shareText(){const T=st.max+1;const sq=st.won?"🟨".repeat(st.clues)+"🟩"+"⬜".repeat(T-1-st.clues):"🟥".repeat(T);
  return "Half a Line #"+n+" · "+(st.won?RANKS[Math.min(st.clues,5)]:MISS)+(st.easy?" (easy mode)":"")+"\n"+sq+"\nhalfaline.andrewcao.org"}
function render(){
  const g=$("game");
  if(st.done){
    const rank=st.won?RANKS[Math.min(st.clues,5)]:MISS;
    g.innerHTML='<div class="end"><p class="verdict"><i>'+rank+'</i>'+(st.won?(st.clues?'Solved with '+st.clues+' extra clue'+(st.clues>1?'s':''):'Solved with no extra clues'):'It was this one.')+'</p>'
      +'<p class="epigraph">'+lineHTML(true)+'</p><div class="orn"></div><h2 class="work" tabindex="-1" id="work">'+esc(L.work)+'</h2>'
      +'<p class="byline">'+esc(L.author)+', '+esc(L.year)+'<span>Spoken by '+esc(L.who.replace(/^The /,"the "))+'</span></p><p class="note">'+esc(L.note)+'</p>'
      +'<div class="slip"><pre>'+esc(shareText())+'</pre><div class="row"><button class="btn" id="copy">Copy result</button><span style="font-size:14px;color:var(--muted)" id="cmsg"></span></div></div>'
      +'<ol class="ladder" aria-label="Ranks, from no extra clues to five">'+RANKS.map((r,k)=>'<li'+(st.won&&Math.min(st.clues,5)===k?' class="me"':'')+'>'+r+'</li>').join("")+'</ol></div>';
    $("copy").onclick=()=>{navigator.clipboard.writeText(shareText()).then(()=>$("cmsg").textContent="Copied.",()=>$("cmsg").textContent="Copy it from the box.")};
    $("work").focus({preventScroll:true});window.scrollTo(0,0);return;
  }
  const left=st.max-st.clues;
  g.innerHTML='<div class="budget"><div class="ticks" aria-hidden="true">'+Array.from({length:st.max},(_,k)=>'<span'+(k<st.clues?' class="used"':'')+'></span>').join("")+'</div><p>'+st.clues+' of '+st.max+' clues used</p></div>'
    +'<p class="epigraph" aria-label="Today’s line, with some words hidden">'+lineHTML(false)+'</p>'
    +(st.clues===0&&!st.misses.length?'<p class="how">Which work is this line from? Each clue, or wrong guess, fills in more of it.</p>':'')
    +'<div class="ask">'+(st.six?sixHTML():'<label for="g">'+(st.clues===st.max?'Last guess. Which work is this from?':'Which work is this from?')+'</label>'
      +'<div class="field"><div class="combo"><input id="g" placeholder="Title or author" autocomplete="off" role="combobox" aria-expanded="false" aria-controls="sugg"><ul class="sugg" id="sugg" role="listbox" hidden></ul></div><button class="btn" id="go">Guess</button></div>')
    +'<p class="msg" id="msg">'+(st.misses.length?'Not '+esc(st.misses[st.misses.length-1])+'.'+(st.clues<st.max||st.last===st.clues?' More of the line is above.':''):'')+'</p>'
    +'<div class="below">'+(st.clues<st.max?'<button class="quiet" id="next">Next clue</button>':'<span></span>')
    +(st.six?'<button class="quiet" id="type" style="font-size:14px">Type the title instead</button>':'<span>Too hard? <button class="quiet" id="pick" style="font-size:14px">Pick from six</button></span>')+'</div></div>';
  if($("next"))$("next").onclick=()=>clue();
  if($("pick"))$("pick").onclick=()=>{st.six=true;render()};
  if($("type"))$("type").onclick=()=>{st.six=false;render()};
  if(st.six){[...document.querySelectorAll(".six button")].forEach(b=>b.onclick=()=>{st.easy=true;guess(b.dataset.w)})}else wire();
}
function sixHTML(){const others=[...new Set(window.HAL_LINES.map(M=>M.work))].filter(w=>w!==L.work);
  let s=n*9301+49297;const r=()=>{s=(s*9301+49297)%233280;return s/233280};const pick=[L.work];
  while(pick.length<6){const w=others[Math.floor(r()*others.length)];if(!pick.includes(w))pick.push(w)}
  pick.sort(()=>r()-.5);
  return '<label>Which work is this from?</label><div class="six">'+pick.map(w=>'<button class="btn ghost" data-w="'+esc(w)+'"'+(st.misses.includes(w)?' disabled':'')+'>'+(st.misses.includes(w)?'<s>'+esc(w)+'</s>':esc(w))+'</button>').join("")+'</div>'}
function wire(){
  const inp=$("g"),ul=$("sugg");let items=[],sel=-1;
  const show=()=>{const q=norm(inp.value);if(!q){ul.hidden=true;inp.setAttribute("aria-expanded","false");items=[];return}
    const a=[],b=[];for(const W of WORKS){const t=norm(W[0]);if(t.startsWith(q))a.push(W);else if(t.includes(q)||norm(W[1]).includes(q))b.push(W)}
    items=a.concat(b).slice(0,6);sel=-1;
    ul.innerHTML=items.map((W,k)=>'<li role="option" id="o'+k+'">'+esc(W[0])+'<small>'+esc(W[1])+'</small></li>').join("");
    ul.hidden=!items.length;inp.setAttribute("aria-expanded",String(!!items.length));
    [...ul.children].forEach((li,k)=>li.onmousedown=e=>{e.preventDefault();guess(items[k][0])})};
  inp.oninput=show;
  inp.onkeydown=e=>{if(e.key==="ArrowDown"&&items.length){sel=(sel+1)%items.length;mark();e.preventDefault()}
    else if(e.key==="ArrowUp"&&items.length){sel=(sel-1+items.length)%items.length;mark();e.preventDefault()}
    else if(e.key==="Enter"){e.preventDefault();submit()}};
  const mark=()=>[...ul.children].forEach((li,k)=>li.setAttribute("aria-selected",String(k===sel)));
  const submit=()=>{if(sel>=0)return guess(items[sel][0]);const q=norm(inp.value);if(!q)return;
    const exact=WORKS.find(W=>norm(W[0])===q);if(exact)return guess(exact[0]);if(items.length===1)return guess(items[0][0]);
    $("msg").textContent="Pick a title from the list.";};
  $("go").onclick=submit;
  if(st.clues||st.misses.length)inp.focus({preventScroll:true});
}
function clue(){if(st.clues<st.max){st.clues++;st.last=st.clues;render()}}
function guess(w){
  const right=w===L.work||(L.alias||[]).includes(w);
  if(right){st.done=true;st.won=true;$("status").textContent="Correct: "+L.work+".";render();return}
  st.misses.push(w);
  if(st.clues>=st.max){st.done=true;st.won=false;$("status").textContent="It was "+L.work+".";render();return}
  st.clues++;st.last=st.clues;$("status").textContent="Not "+w+". More of the line is shown.";render();
}
start(Math.min(10,Math.max(1,parseInt((location.hash.match(/d(\d+)/)||[])[1]||"2",10))));
// For screenshots: #d2c2 opens day 2 with two clues shown; #d2end opens it solved.
{const c=location.hash.match(/c(\d)/);if(c){st.clues=st.last=+c[1];render()}if(/end/.test(location.hash)){st.clues=2;st.done=st.won=true;render()}}
</script>
</body>
</html>
